name: Deploy to cPanel (static export)

# Auto-deploy: every push to main builds the Next.js static export and mirrors it
# to the thermoleak.co.il docroot on the cPanel server (websquadinc account) over
# FTPS, then purges the Cloudflare cache.
#
# Transport note: the cPanel account is `noshell`, so SSH/rsync is unavailable.
# We use lftp over FTPS (explicit TLS) with a deploy-only FTP account scoped to the
# thermoleak docroot. `mirror --delete` makes the remote match ./out exactly, so the
# first run also clears the old WordPress files that lived there.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: true

env:
  CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build # -> ./out

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy to cPanel via FTPS (mirror, replaces remote)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -c "
          set ftp:ssl-force true;
          set ftp:ssl-protect-data true;
          set ssl:verify-certificate no;
          set net:max-retries 3;
          set net:timeout 20;
          open -u '$FTP_USER','$FTP_PASSWORD' '$FTP_HOST';
          mirror -R --delete --parallel=4 --verbose \
            --exclude-glob .well-known/ --exclude-glob .ftpquota \
            ./out/ ;
          "

      - name: Purge Cloudflare cache
        if: env.CF_API_TOKEN != ''
        run: |
          curl -fsS -X POST \
            "https://api.cloudflare.com/client/v4/zones/${{ secrets.CF_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
