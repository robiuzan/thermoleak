name: Deploy to cPanel (static export)

# Auto-deploy: every push to main builds the Next.js static export and mirrors it
# to the thermoleak.co.il docroot on the cPanel server (websquadinc account) via
# rsync over SSH. The site is live the moment rsync finishes.
#
# Transport: FTP is disabled on this server, so we use rsync over SSH. The
# websquadinc account has a jailed shell + an authorized deploy key (private key
# in the SSH_PRIVATE_KEY secret). `rsync --delete` makes the docroot match ./out
# exactly, so the first run also clears the old WordPress files that lived there.
# `.well-known` is preserved so cPanel AutoSSL/ACME keeps working.
#
# There is deliberately NO Cloudflare cache-purge step. Cloudflare serves this
# site's HTML with cf-cache-status: DYNAMIC (uncached) and every static asset is
# content-hashed, so a purge has nothing to clear - which is why deploys landed
# correctly on all 11 pages during the months its CF_API_TOKEN sat expired and the
# purge returned 401. Keeping a step that could only ever fail meant every run
# reported failure, which camouflaged the runs that failed for real reasons.
#
# Reinstate a purge ONLY if a Cache Rule is later added that caches HTML. If so,
# mint a token scoped to Zone > Cache Purge > Purge on this zone alone - do NOT
# reuse the fleet-wide Sys Admin token: this repo is PUBLIC.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build # -> ./out

      - name: Deploy via rsync over SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p 22 -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          rsync -rltzv --delete --chmod=D755,F644 \
            --exclude='.well-known' \
            -e "ssh -p 22 -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
            ./out/ "$SSH_USER@$SSH_HOST:thermoleak.co.il/"

      - name: Verify the deploy landed
        run: |
          # rsync exiting 0 does not prove the origin is serving the new build, so assert it.
          for path in / /contact/ /services/; do
            code=$(curl -sL -o /dev/null -w '%{http_code}' --max-time 20 "https://thermoleak.co.il$path")
            echo "  $path -> HTTP $code"
            [ "$code" = "200" ] || { echo "::error::https://thermoleak.co.il$path returned $code"; exit 1; }
          done
