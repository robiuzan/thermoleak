name: Deploy to cPanel (static export)

# Auto-deploy: every push to main builds the Next.js static export and mirrors it
# to the thermoleak.co.il docroot on the cPanel server (websquadinc account) via
# rsync over SSH, then purges the Cloudflare cache.
#
# Transport: FTP is disabled on this server, so we use rsync over SSH. The
# websquadinc account has a jailed shell + an authorized deploy key (private key
# in the SSH_PRIVATE_KEY secret). `rsync --delete` makes the docroot match ./out
# exactly, so the first run also clears the old WordPress files that lived there.
# `.well-known` is preserved so cPanel AutoSSL/ACME keeps working.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: true

env:
  CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build # -> ./out

      - name: Deploy via rsync over SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p 22 -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          rsync -rltzv --delete --chmod=D755,F644 \
            --exclude='.well-known' \
            -e "ssh -p 22 -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
            ./out/ "$SSH_USER@$SSH_HOST:thermoleak.co.il/"

      # Best-effort: the site is already live once rsync finishes. Cloudflare serves this HTML
      # cf-cache-status: DYNAMIC (uncached) and every static asset is content-hashed, so a failed
      # purge does not leave anything stale. It must therefore never fail the deploy - a red run
      # here would hide a genuinely broken build or rsync, which is exactly what happened while
      # CF_API_TOKEN sat expired and every deploy reported failure.
      - name: Purge Cloudflare cache (best effort)
        if: env.CF_API_TOKEN != ''
        continue-on-error: true
        run: |
          code=$(curl -s -o /tmp/purge.json -w '%{http_code}' -X POST \
            "https://api.cloudflare.com/client/v4/zones/${{ secrets.CF_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          if [ "$code" = "200" ]; then
            echo "Cache purged."
          else
            echo "::warning::Cache purge returned HTTP $code - deploy still succeeded."
            echo "::warning::A 401/403 means the CF_API_TOKEN secret is expired or under-scoped."
            echo "::warning::Fix: mint a token with Zone > Cache Purge > Purge on zone CF_ZONE_ID,"
            echo "::warning::then 'gh secret set CF_API_TOKEN --repo robiuzan/thermoleak'."
            cat /tmp/purge.json || true
          fi
