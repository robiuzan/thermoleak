name: CI (build gate only — pushing does NOT deploy)

# ── THIS WORKFLOW DOES NOT DEPLOY ─────────────────────────────────────────────
# Production is CLOUDFLARE PAGES (project 'thermoleak'), direct upload via
# wrangler, since the 2026-08-02 fleet cutover. Deploys run from a workstation:
#
#   powershell -File "c:/Users/robiu/antigravity/Projects/Israeli services sites/ops/deploy-site.ps1" -Domain thermoleak.co.il -DryRun
#   powershell -File "c:/Users/robiu/antigravity/Projects/Israeli services sites/ops/deploy-site.ps1" -Domain thermoleak.co.il -Confirm
#
# History, so nobody resurrects the old path: until 2026-08-02 this workflow
# rsynced ./out to a cPanel docroot over SSH. The DNS cutover to Pages retired
# that origin — but this workflow kept running and kept reporting green while
# writing to a server the public site no longer read from. Fifteen days of
# "successful" deploys never reached production; the drift was caught on
# 2026-08-17 only when a build-stamp assertion was added. The rsync steps and
# their secrets (SSH_PRIVATE_KEY / SSH_HOST / SSH_USER) were removed with the
# cutover acknowledged. Headers/redirects live in public/_headers and
# public/_redirects (Pages format); .htaccess is gone with the Apache origin.
#
# What remains is the useful part: an independent build gate on every push, so
# a broken build is caught even when nobody ran the gate locally.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build static export
        run: npm run build # -> ./out (build-gate only; wrangler ships from the workstation)
