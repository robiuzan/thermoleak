<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="ThermoLeak">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#082a40"/>
      <stop offset="0.55" stop-color="#0b3d5c"/>
      <stop offset="1" stop-color="#0b3d5c"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="22%" r="60%">
      <stop offset="0" stop-color="#ff6a3d" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#1e88a8" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#0b3d5c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#1E88A8"/>
      <stop offset="1" stop-color="#FF6A3D"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- logo mark -->
  <g transform="translate(110 150)">
    <rect width="150" height="150" rx="34" fill="#0e2c41"/>
    <path d="M75 30c17 22 28 36 28 52a28 28 0 1 1-56 0c0-16 11-30 28-52z" fill="url(#mark)"/>
    <circle cx="63" cy="98" r="7.5" fill="#fff" opacity="0.9"/>
  </g>

  <!-- wordmark + tagline (Latin for reliable rasterization) -->
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="300" y="220" font-size="92" font-weight="800" fill="#ffffff">ThermoLeak</text>
    <text x="302" y="280" font-size="38" font-weight="600" fill="#9fd0df">Thermal Leak Detection &#183; Gush Dan, Israel</text>
  </g>

  <!-- accent bar -->
  <rect x="300" y="320" width="540" height="6" rx="3" fill="#FF6A3D"/>

  <!-- feature chips -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#0b3d5c">
    <g transform="translate(300 380)">
      <rect width="250" height="64" rx="32" fill="#ffffff"/>
      <text x="125" y="42" text-anchor="middle">No wall damage</text>
    </g>
    <g transform="translate(575 380)">
      <rect width="300" height="64" rx="32" fill="#ffffff"/>
      <text x="150" y="42" text-anchor="middle">Insurance report</text>
    </g>
  </g>

  <text x="110" y="560" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#ffffff">thermoleak.co.il</text>
</svg>
