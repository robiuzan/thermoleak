<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="הדמיית סריקה תרמית לאיתור נזילה">
  <defs>
    <radialGradient id="heat" cx="32%" cy="68%" r="75%">
      <stop offset="0" stop-color="#ff6a3d"/>
      <stop offset="0.2" stop-color="#c2410c"/>
      <stop offset="0.5" stop-color="#1e88a8"/>
      <stop offset="0.82" stop-color="#0b3d5c"/>
      <stop offset="1" stop-color="#082a40"/>
    </radialGradient>
    <pattern id="scan" width="1" height="14" patternUnits="userSpaceOnUse">
      <rect width="800" height="1.5" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="800" height="800" rx="32" fill="url(#heat)"/>
  <rect width="800" height="800" rx="32" fill="url(#scan)"/>

  <!-- abstract wall / pipe outline -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="3">
    <rect x="120" y="170" width="560" height="430" rx="10"/>
    <path d="M210 600V330h140v270M450 600V410h150"/>
  </g>

  <!-- detected leak hot-spot -->
  <g transform="translate(300 470)">
    <circle r="70" fill="#ff6a3d" opacity="0.35"/>
    <circle r="42" fill="#ff6a3d" opacity="0.55"/>
    <circle r="6" fill="#fff"/>
    <g stroke="#fff" stroke-width="3">
      <line x1="-90" y1="0" x2="-50" y2="0"/>
      <line x1="50" y1="0" x2="90" y2="0"/>
      <line x1="0" y1="-90" x2="0" y2="-50"/>
      <line x1="0" y1="50" x2="0" y2="90"/>
    </g>
  </g>

  <!-- labels -->
  <g font-family="Assistant, Arial, sans-serif" font-weight="700">
    <g transform="translate(540 110)">
      <rect x="-150" y="-26" width="170" height="44" rx="22" fill="#000000" opacity="0.4"/>
      <circle cx="-8" cy="-4" r="6" fill="#ff6a3d"/>
      <text x="-28" y="2" font-size="20" fill="#fff" text-anchor="end">סריקה תרמית</text>
    </g>
    <g transform="translate(150 700)">
      <rect x="0" y="-30" width="230" height="52" rx="14" fill="#ffffff"/>
      <text x="115" y="4" font-size="22" fill="#0b3d5c" text-anchor="middle">מוקד נזילה אותר ✓</text>
    </g>
  </g>
</svg>
